name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Test
        run: cargo test --all-targets -- --nocapture
      - name: Build release
        run: cargo build --release
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: memory-tester-windows-x64
          path: target/release/memory-tester.exe
          if-no-files-found: error
