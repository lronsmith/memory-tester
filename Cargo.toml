[package]
name = "memory-tester"
version = "0.1.0"
edition = "2024"
description = "A tiny Windows RAM tester: shows your memory sticks, runs a test, and colours each stick by result."
license = "MIT"
repository = "https://github.com/lronsmith/memory-tester"
# Released as an exe on GitHub, never on crates.io.
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
png = { version = "0.18.1", optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
# Development only: adds --screenshot flags that save a PNG of the window.
screenshot = ["dep:png"]
